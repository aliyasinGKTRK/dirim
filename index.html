<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Boss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-1: #fff1b8;
    --gold-2: #f3c64a;
    --gold-3: #b8860b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    background: #ffffff;
    /* Görseli hem yatay hem dikey tam ortala */
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 16px;
  }

  .hero {
    position: relative;
    /* Genişlik ve yükseklik ekrana göre sınırlanır, oran korunur (1086x1448) */
    width: min(100%, 520px, calc((100dvh - 32px) * 1086 / 1448));
    aspect-ratio: 1086 / 1448;
    /* Yazı/taç boyutları bu kutunun genişliğine göre ölçeklenir */
    container-type: inline-size;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .22), 0 0 0 1px rgba(184, 134, 11, .45);
  }
  .hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Okunabilirlik için alttan koyu geçiş */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.35) 28%, transparent 55%);
    pointer-events: none;
  }

  .title {
    position: absolute;
    left: 0; right: 0;
    bottom: 7%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .crown {
    width: 22cqw;
    height: auto;
    margin-bottom: -1cqw;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.7));
  }

  .big-boss {
    font-family: "UnifrakturMaguntia", "Old English Text MT", "Blackletter", serif;
    font-weight: 400;
    font-size: 17cqw;
    line-height: 1.05;
    letter-spacing: .02em;
    background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 50%, var(--gold-3) 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.85));
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: no-preference) {
    .crown { animation: float 3.5s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1.2cqw); }
    }
  }
</style>
</head>
<body>

  <main class="hero">
    <img src="ibo.jpeg" alt="Big Boss">

    <div class="title">
      <!-- Kral tacı (SVG) -->
      <svg class="crown" viewBox="0 0 200 125" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1b8"/>
            <stop offset=".5" stop-color="#f3c64a"/>
            <stop offset="1" stop-color="#b8860b"/>
          </linearGradient>
        </defs>
        <!-- Gövde -->
        <path d="M22 98 L8 32 L56 68 L100 16 L144 68 L192 32 L178 98 Z"
              fill="url(#gold)" stroke="#7a5600" stroke-width="3" stroke-linejoin="round"/>
        <!-- Alt bant -->
        <rect x="22" y="98" width="156" height="18" rx="4"
              fill="url(#gold)" stroke="#7a5600" stroke-width="3"/>
        <!-- Uç taşları -->
        <circle cx="8"   cy="28" r="8" fill="#e63946" stroke="#7a5600" stroke-width="2.5"/>
        <circle cx="100" cy="11" r="9" fill="#3a86ff" stroke="#7a5600" stroke-width="2.5"/>
        <circle cx="192" cy="28" r="8" fill="#e63946" stroke="#7a5600" stroke-width="2.5"/>
        <!-- Bant taşları -->
        <circle cx="56"  cy="107" r="4.5" fill="#2ec4b6" stroke="#7a5600" stroke-width="1.5"/>
        <circle cx="100" cy="107" r="5.5" fill="#e63946" stroke="#7a5600" stroke-width="1.5"/>
        <circle cx="144" cy="107" r="4.5" fill="#2ec4b6" stroke="#7a5600" stroke-width="1.5"/>
      </svg>

      <h1 class="big-boss">Big Boss</h1>
    </div>
  </main>

</body>
</html>
